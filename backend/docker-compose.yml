services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: say_hi_chai
      POSTGRES_USER: say_hi_chai
      POSTGRES_PASSWORD: say_hi_chai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U say_hi_chai -d say_hi_chai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
